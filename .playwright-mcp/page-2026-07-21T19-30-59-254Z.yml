            - generic [ref=e257]: To use Facebook Login in a desktop app, you’ll need to be able to embed a web browser (sometimes called a webview) within the app to perform the login process.
            - generic [ref=e262]:
              - heading "Checking Login Status" [level=2] [ref=e263]
              - button [ref=e264] [cursor=pointer]
            - generic [ref=e268]:
              - text: Apps using our SDKs can check whether someone has already logged in using built-in functions. All other apps must
              - link "create their own way of storing when a person has logged in" [ref=e269] [cursor=pointer]:
                - /url: "#token"
              - text: ", and when that indicator is not there, proceed on the assumption that they are logged out. If someone is logged out, then your app should redirect them to the Login dialog at an appropriate time — for example if they click a login button."
            - generic [ref=e272]:
              - heading "Logging People In" [level=2] [ref=e273]
              - button [ref=e274] [cursor=pointer]
            - generic [ref=e278]:
              - text: Whether someone is not logged into your app or not logged into Facebook, you can use
              - link "the Login dialog" [ref=e279] [cursor=pointer]:
                - /url: /documentation/facebook-login/overview#logindialog
              - text: to prompt them to do both. If they aren’t logged into Facebook, they’ll be prompted to login and then move onto logging into your app. This is automatically detected, so you don’t need to do anything extra to enable this behavior.
