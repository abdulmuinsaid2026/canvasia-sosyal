              - button [ref=e507] [cursor=pointer]
            - generic [ref=e510]: "This endpoint has some required parameters:"
            - list [ref=e511]:
              - listitem [ref=e513]:
                - code [ref=e514]: client_id
                - text: . Your app’s IDs
              - listitem [ref=e516]:
                - code [ref=e517]: redirect_uri
                - text: . This argument is required and must be the same as the original
                - code [ref=e518]: request_uri
                - text: that you used when starting the OAuth login process.
              - listitem [ref=e520]:
                - code [ref=e521]: client_secret
                - text: . Your unique app secret, shown on the
                - link "App Dashboard" [ref=e522] [cursor=pointer]:
                  - /url: /apps
                - text: . Never include this app secret in client-side code or in binaries that could be decompiled. It is extremely important that it remains completely secret as it is the core of the security of your app and all the people using it.
              - listitem [ref=e524]:
                - code [ref=e525]: code
                - text: . The parameter received from the Login Dialog redirect above.
            - strong [ref=e527]: Response
            - generic [ref=e528]: "The response you will receive from this endpoint will be returned in JSON format and, if successful, is:"
            - generic [ref=e529]:
              - code [ref=e531]: "{ \"access_token\": {access-token}, \"token_type\": {type}, \"expires_in\": {seconds-til-expiration} }"
              - button [ref=e532] [cursor=pointer]
            - generic [ref=e535]: If it is not successful, you will receive an explanatory error message.
            - generic [ref=e538]:
              - heading "Inspecting Access Tokens" [level=2] [ref=e539]
              - button [ref=e540] [cursor=pointer]
            - generic [ref=e544]:
              - text: Whether or not your app uses
              - code [ref=e545]: code
              - text: or
              - code [ref=e546]: token
              - text: as your
              - code [ref=e547]: response_type
              - text: "from the Login dialog, it will have received an access token. You can perform automated checks on these tokens using a Graph API endpoint:"
            - generic [ref=e548]:
              - code [ref=e550]: "GET graph.facebook.com/debug_token? input_token={token-to-inspect} &access_token={app-token-or-admin-token}"
              - button [ref=e551] [cursor=pointer]
            - generic [ref=e554]: "This endpoint takes the following parameters:"
            - list [ref=e555]:
              - listitem [ref=e557]:
                - code [ref=e558]: input_token
                - text: . The token you need to inspect.
              - listitem [ref=e560]:
                - code [ref=e561]: access_token
                - text: An
                - link "app access token" [ref=e562] [cursor=pointer]:
                  - /url: /documentation/facebook-login/guides/access-tokens
                - text: or an access token for a developer of the app.
            - generic [ref=e563]: "The response of the API call is a JSON array containing data about the inspected token. For example:"
            - generic [ref=e564]:
              - code [ref=e566]: "{ \"data\": { \"app_id\": 138483919580948, \"type\": \"USER\", \"application\": \"Social Cafe\", \"expires_at\": 1352419328, \"is_valid\": true, \"issued_at\": 1347235328, \"metadata\": { \"sso\": \"iphone-safari\" }, \"scopes\": [ \"email\", \"publish_actions\" ], \"user_id\": \"1207059\" } }"
              - button [ref=e567] [cursor=pointer]
            - generic [ref=e570]:
              - text: The
              - code [ref=e571]: app_id
              - text: and
              - code [ref=e572]: user_id
              - text: fields help your app verify that the access token is valid for the person and for your app. For a full description of the other fields, see the
              - link "Getting Info about Access Tokens guide" [ref=e573] [cursor=pointer]:
                - /url: /documentation/facebook-login/guides/access-tokens
              - text: .
            - generic [ref=e576]:
              - heading "Checking Permissions" [level=3] [ref=e577]
              - button [ref=e578] [cursor=pointer]
            - generic [ref=e582]:
              - text: The
              - link [ref=e583] [cursor=pointer]:
                - /url: /docs/graph-api/reference/user/permissions
                - code [ref=e584]: /me/permissions
                - text: edge
              - text: can be called in order to retrieve a list of permissions that have been granted or declined by a particular user. Your app can use this to check which of the requested permissions it cannot use for any particular user.
            - generic [ref=e587]:
              - heading "Re-asking for Declined Permissions" [level=2] [ref=e588]
              - button [ref=e589] [cursor=pointer]
            - generic [ref=e593]: "Facebook Login lets people decline sharing some permissions with your app. The Login Dialog contains a screen that looks like this:"
            - img "Login dialog Info You Provide screen where users can toggle optional permissions like Email and Likes while public profile stays required" [ref=e595] [cursor=pointer]
            - generic [ref=e596]:
              - text: The
              - code [ref=e597]: public_profile
              - text: permission is always required and greyed out because it can’t be disabled.
            - generic [ref=e598]:
              - text: However, if someone were to uncheck
              - code [ref=e599]: user_likes
              - text: (Likes) in this example, checking
              - link [ref=e600] [cursor=pointer]:
                - /url: /docs/graph-api/reference/user/permissions
                - code [ref=e601]: /me/permissions
              - text: "for which permissions have been granted results in:"
            - generic [ref=e602]:
              - code [ref=e604]: "{ \"data\": [ { \"permission\":\"public_profile\", \"status\":\"granted\" }, { \"permission\":\"user_likes\", \"status\":\"declined\" } ] }"
              - button [ref=e605] [cursor=pointer]
            - generic [ref=e608]:
              - text: Note that
              - code [ref=e609]: user_likes
              - text: has been declined instead of granted.
            - generic [ref=e610]:
              - text: It’s OK to ask a person again to grant your app permissions that they’ve declined. You should have a screen of education on why you think they should grant the permission to you and then re-ask. But if you invoke the Login Dialog
              - link "as before" [ref=e611] [cursor=pointer]:
                - /url: "#logindialog"
              - text: ", it won’t ask for that permission."
            - strong [ref=e613]: This is because once someone has declined a permission, the Login Dialog will not re-ask them for it unless you explicitly tell the dialog you’re re-asking for a declined permission.
            - generic [ref=e614]:
              - text: You do this by adding the
              - code [ref=e615]: auth_type=rerequest
              - text: "parameter to your Login Dialog URL:"
            - generic [ref=e616]:
              - code [ref=e618]: "https://www.facebook.com/v25.0/dialog/oauth?client_id={app-id} &redirect_uri={redirect-uri} &auth_type=rerequest scope=email"
              - button [ref=e619] [cursor=pointer]
            - generic [ref=e622]: Using this, the Login Dialog will re-ask for the declined permission.
            - generic [ref=e625]:
              - heading "Storing Access Tokens and Login Status" [level=2] [ref=e626]
              - button [ref=e627] [cursor=pointer]
            - generic [ref=e631]: At this point in the flow, you have someone authenticated and logged in. Your app is ready to make API calls on their behalf. Before doing so, it should store the access token and the login status of the person using the app.
            - generic [ref=e634]:
              - heading "Storing Access Tokens" [level=4] [ref=e635]
              - button [ref=e636] [cursor=pointer]
            - generic [ref=e640]:
              - text: After your app receives the access token from the previous step, the token should be stored so it’s available to all parts of the app when it makes API calls. There is no specific process here, however in general if you’re building a web app, it is best to add the token as a session variable to identify that browser session with a particular person, if you’re building a native desktop or mobile app, then you should use the datastore available to your app. Also, the app should store the token in a database along with the
              - code [ref=e641]: user_id
              - text: to identify it.
            - generic [ref=e642]:
              - text: Please see our note about the
              - link "size of access tokens in the access token document" [ref=e643] [cursor=pointer]:
                - /url: /docs/facebook-login/access-tokens/debugging-and-error-handling#sizes
              - text: .
            - generic [ref=e646]:
              - heading "Tracking login status" [level=4] [ref=e647]
              - button [ref=e648] [cursor=pointer]
            - generic [ref=e652]:
              - text: Again, your app should store a person’s login status, which helps avoid having to make additional calls to the Login dialog. Whatever procedure you chose, modify your
              - link "login status checking" [ref=e653] [cursor=pointer]:
                - /url: "#checklogin"
              - text: to account for it.
            - generic [ref=e656]:
              - heading "Logging People Out" [level=2] [ref=e657]
              - button [ref=e658] [cursor=pointer]
            - generic [ref=e662]:
              - text: You can log people out of your app by undoing
              - link "whatever login status indicator you added" [ref=e663] [cursor=pointer]:
                - /url: "#token"
              - text: ", for example deleting the session that indicates a person is logged in. You should also remove the stored access token."
            - generic [ref=e664]:
              - text: Logging someone out is not the same as revoking login permission (removing previously granted authentication),
              - link "which can be performed separately" [ref=e665] [cursor=pointer]:
                - /url: /documentation/facebook-login/guides/permissions/request-revoke#revokelogin
              - text: . Because of this, build your app so it doesn’t automatically force people who have logged out back to the Login dialog.
            - generic [ref=e668]:
              - heading "Detecting When People Uninstall Apps" [level=2] [ref=e669]
              - button [ref=e670] [cursor=pointer]
            - generic [ref=e674]: People are able to uninstall apps via Facebook.com without interacting with the app itself. To help apps detect when this has happened, we allow them to provide a de-authorize callback URL which will be pinged whenever this occurs.
            - generic [ref=e675]:
              - text: You can enable a deauthorize callback through the
              - link "App Dashboard" [ref=e676] [cursor=pointer]:
                - /url: /docs/development/create-an-app/app-dashboard/data-deletion-callback
              - text: .
            - generic [ref=e679]:
              - heading "Responding to Requests to Delete User Data" [level=2] [ref=e680]
              - button [ref=e681] [cursor=pointer]
            - generic [ref=e685]:
              - text: People can request an app to delete all information about them received from Facebook. For responding to these requests, see
              - link "Data Deletion Request Callback" [ref=e686] [cursor=pointer]:
                - /url: /docs/apps/delete-data
              - text: .
