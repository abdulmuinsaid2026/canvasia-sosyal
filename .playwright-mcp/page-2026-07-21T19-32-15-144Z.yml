          - article [ref=f6e285]:
            - heading "Long-Lived Access Tokens" [level=1] [ref=f6e286]
            - generic [ref=f6e287]: "Updated: Jun 30, 2026"
            - generic [ref=f6e291]:
              - button "Copy for LLM" [ref=f6e293] [cursor=pointer]
              - link "View as Markdown" [ref=f6e300] [cursor=pointer]:
                - /url: /documentation/facebook-login/guides/access-tokens/get-long-lived.md
            - generic [ref=f6e306]: Default User and Page access tokens are short-lived, expiring in hours, however, you can exchange a short-lived token for a long-lived token.
            - generic [ref=f6e307]: When you use the iOS, Android, or JavaScript SDK, the SDK will automatically refresh tokens if the person has used your app within the last 90 days. Native mobile apps using Facebook’s SDKs get long-lived User access tokens, good for about 60 days. These tokens are refreshed once per day, when the person using your app makes a request to Facebook’s servers. If no requests are made, the token will expire after about 60 days and the person will have to go through the login flow again to get a new token.
            - generic [ref=f6e308]: "Latest Graph API Version: v25.0"
            - generic [ref=f6e311]:
              - heading "Get a Long-Lived User Access Token" [level=2] [ref=f6e312]
              - button [ref=f6e313] [cursor=pointer]
            - generic [ref=f6e317]: If you need a long-lived User access token you can generate one from a short-lived User access token. A long-lived token generally lasts about 60 days.
            - generic [ref=f6e318]: "You will need the following:"
            - list [ref=f6e319]:
              - listitem [ref=f6e321]: A valid User Access Token
              - listitem [ref=f6e323]: Your App ID
              - listitem [ref=f6e325]: Your App Secret
            - generic [ref=f6e326]:
              - text: Query the
              - code [ref=f6e327]: GET oauth/access_token
              - text: endpoint.
            - generic [ref=f6e328]:
              - code [ref=f6e330]: "curl -i -X GET \"https://graph.facebook.com/{graph-api-version}/oauth/access_token? grant_type=fb_exchange_token& client_id={app-id}& client_secret={app-secret}& fb_exchange_token={your-access-token}\""
              - button [ref=f6e331] [cursor=pointer]
            - generic [ref=f6e336]:
              - heading "Sample Response" [level=4] [ref=f6e337]
              - button [ref=f6e338] [cursor=pointer]
            - generic [ref=f6e342]:
              - generic [ref=f6e343]: "{ \"access_token\":\"{long-lived-user-access-token}\", \"token_type\": \"bearer\", \"expires_in\": 5183944 //The number of seconds until the token expires }"
              - button [ref=f6e346] [cursor=pointer]
            - generic [ref=f6e349]: "The workflow for generating a long-lived User access token is as follows:"
            - img "Swimlane diagram of the long-lived User access token flow across Client, Your Server, and Facebook" [ref=f6e351] [cursor=pointer]
            - generic [ref=f6e352]: Once you have retrieved the long-lived token, you can use it from your server or send it back to the client to use there.
            - generic [ref=f6e355]:
              - heading "Caveats" [level=4] [ref=f6e356]
              - button [ref=f6e357] [cursor=pointer]
            - list [ref=f6e361]:
              - listitem [ref=f6e363]:
                - generic [ref=f6e364]:
                  - strong [ref=f6e365]: You can not use an expired token to request a long-lived token.
                  - text: If the token has expired, your app must send the user through the login flow again to regenerate a new short-lived access token.
              - listitem [ref=f6e367]:
                - generic [ref=f6e368]:
                  - strong [ref=f6e369]: Make this call from your server, not a client.
                  - text: Your app secret is included in this API call, so you should never make the request client-side. Instead implement server-side code that makes the request, then pass the response containing the long-lived token back to your client-side code. This will be a different string than the original token, so if you’re storing these tokens, replace the old one.
              - listitem [ref=f6e371]:
                - generic [ref=f6e372]:
                  - strong [ref=f6e373]: Do not use the same long-lived tokens on more than one web client
                  - text: (i.e. if the person logs in from more than one computer). Instead, you should use the long-lived tokens on your server to generate a code and then use that to get a long-lived token on the client. Please see below for information
                  - link "Generating long-lived tokens from server-side long-lived tokens" [ref=f6e374] [cursor=pointer]:
                    - /url: "#long-via-code"
                  - text: .
            - generic [ref=f6e377]:
              - heading "Get a Long-Lived Page Access Token" [level=2] [ref=f6e378]
              - button [ref=f6e379] [cursor=pointer]
            - generic [ref=f6e383]:
              - text: If you need a long-lived Page access token, you can generate one from a long-lived User access token. Long-lived Page access token do not have an expiration date and only
              - link "expire or are invalidated under certain conditions" [ref=f6e384] [cursor=pointer]:
                - /url: /docs/facebook-login/access-tokens/debugging-and-error-handling#expiredtokens
              - text: .
            - generic [ref=f6e385]: "You will need the following:"
            - list [ref=f6e386]:
              - listitem [ref=f6e388]:
                - text: A valid
                - link "long-lived User access token" [ref=f6e389] [cursor=pointer]:
                  - /url: "#get-a-long-lived-user-access-token"
                - text: . The person requesting the token must have a role on the Page.
            - generic [ref=f6e390]:
              - text: Query the
              - code [ref=f6e391]: "GET {app-scoped-user-id}?accounts"
              - text: endpoint.
            - generic [ref=f6e392]:
              - code [ref=f6e394]: "curl -i -X GET \"https://graph.facebook.com/{graph-api-version}/{app-scoped-user-id}/accounts? access_token={long-lived-user-access-token}\""
              - button [ref=f6e395] [cursor=pointer]
            - generic [ref=f6e400]:
              - heading "Sample Response" [level=4] [ref=f6e401]
              - button [ref=f6e402] [cursor=pointer]
            - generic [ref=f6e406]:
              - generic [ref=f6e407]: "{ \"data\":[ { \"access_token\":\"{long-lived-page-access-token}\", \"category\":\"Brand\", \"category_list\":[ { \"id\":\"1605186416478696\", \"name\":\"Brand\" } ], \"name\":\"Cute Kitten Page\", \"id\":\"{page-id}\", \"tasks\":[ \"ANALYZE\", \"ADVERTISE\", \"MODERATE\", \"CREATE_CONTENT\", \"MANAGE\" ] } ], \"paging\":{ \"cursors\":{ \"before\":\"MTM1MzI2OTg2NDcyODg3OQZDZD\", \"after\":\"MTM1MzI2OTg2NDcyODg3OQZDZD\" } } }"
              - button [ref=f6e410] [cursor=pointer]
            - generic [ref=f6e415]:
              - heading "Get Long_lived Tokens for Clients" [level=2] [ref=f6e416]
              - button [ref=f6e417] [cursor=pointer]
            - generic [ref=f6e421]: "Facebook has an option for getting long-lived access tokens for apps to avoid triggering Facebook’s automated spam systems. Apps that:"
            - list [ref=f6e422]:
              - listitem [ref=f6e424]: Have their own authentication system (use a username/password for example)
              - listitem [ref=f6e426]: Store a Facebook access token on their servers for people using different clients (browser or native mobile apps)
              - listitem [ref=f6e428]: Make API calls from all these different clients
            - generic [ref=f6e429]: "At a high level, you obtain a long-lived token for the client by:"
            - list [ref=f6e430]:
              - listitem [ref=f6e432]: Using a valid, long-lived access token, your server sends a request to get a code from Facebook.
              - listitem [ref=f6e434]: Facebook sends a code back to your server and you securely send this code to the client.
              - listitem [ref=f6e436]: The client uses this code to request a long-lived token from Facebook.
              - listitem [ref=f6e438]: Facebook sends the client a long-lived token which is used to post stories or query data.
            - generic [ref=f6e441]:
              - heading "Get a Code" [level=3] [ref=f6e442]
              - button [ref=f6e443] [cursor=pointer]
            - generic [ref=f6e447]:
              - text: Query the
              - code [ref=f6e448]: GET oauth/client_code
              - text: endpoint. The redirect URI must be the exact value you set in your
              - link "app dashboard" [ref=f6e449] [cursor=pointer]:
                - /url: https://developers.facebook.com/apps
              - text: under the Facebook Login > Settings Client > OAuth Settings card.
            - generic [ref=f6e450]:
              - code [ref=f6e452]: "curl -i -X GET \"https://graph.facebook.com/{graph-api-version}/oauth/client_code? client_id={app-id}& client_secret={app-secret}& redirect_uri={app-redirect-uri}& access_token={long-lived-user-access-token}\""
              - button [ref=f6e453] [cursor=pointer]
            - generic [ref=f6e458]:
              - heading "Sample Response" [level=4] [ref=f6e459]
              - button [ref=f6e460] [cursor=pointer]
            - generic [ref=f6e464]:
              - generic [ref=f6e465]: "{ \"code\":\"{code-for-your-client}\" }"
              - button [ref=f6e468] [cursor=pointer]
            - generic [ref=f6e473]:
              - heading "Redeem the Code for a Long-lived Access Token" [level=3] [ref=f6e474]
              - button [ref=f6e475] [cursor=pointer]
            - generic [ref=f6e479]:
              - text: Once you’ve retrieved the code from Facebook’s server you then need to ship it to the client via a secure channel. Once that’s done, you need to make a request from the client to the
              - code [ref=f6e480]: /oauth/access_token
              - text: "endpoint:"
            - generic [ref=f6e481]:
              - code [ref=f6e483]: "curl -i -X GET \"https://graph.facebook.com/{graph-api-version}/oauth/access_token? code={code-for-your-client}& client_id={app-id}& redirect_uri={app-redirect-uri}& machine_id= {your-client-machine-id}\""
              - button [ref=f6e484] [cursor=pointer]
            - generic [ref=f6e487]:
              - text: The
              - code [ref=f6e488]: machine_id
              - text: is an optional parameter that identifies and tracks clients and is used for security and spam prevention. It is a
              - strong [ref=f6e489]: per client
              - text: not
              - strong [ref=f6e490]: per user
              - text: value. If you have previously made calls to get a code and been provided a
              - code [ref=f6e491]: machine_id
              - text: you should include in your code request.
            - generic [ref=f6e494]:
              - heading "Sample Response" [level=4] [ref=f6e495]
              - button [ref=f6e496] [cursor=pointer]
            - generic [ref=f6e500]:
              - code [ref=f6e502]: "{ \"access_token\":\"{long-lived-access-token}\", \"expires_in\":5183944, //The number of seconds until the token expires \"machine_id\":\"{your-client-machine-id}\" }"
              - button [ref=f6e503] [cursor=pointer]
            - generic [ref=f6e506]: "The workflow for generating a long-lived token is as follows:"
            - img "Swimlane diagram of generating a long-lived client token via a server-issued code across Client, Your Server, and Facebook" [ref=f6e508] [cursor=pointer]
