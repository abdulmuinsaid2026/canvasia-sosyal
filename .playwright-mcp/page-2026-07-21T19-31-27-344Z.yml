                - listitem [ref=f1e124]:
                  - code [ref=f1e125]: error_subcode
                  - text: ": Additional information about the error. Common values are listed below."
                - listitem [ref=f1e126]:
                  - code [ref=f1e127]: error_user_msg
                  - text: ": The message to display to the user. The language of the message is based on the locale of the API request."
                - listitem [ref=f1e128]:
