                - /url: /documentation/instagram-platform/create-an-instagram-app
              - text: to your app and configure your
              - link [ref=f69e329] [cursor=pointer]:
                - /url: /documentation/instagram-platform/create-an-instagram-app#step-9--set-up-business-login
                - strong [ref=f69e330]: Business login settings
              - text: in the Meta App Dashboard.
