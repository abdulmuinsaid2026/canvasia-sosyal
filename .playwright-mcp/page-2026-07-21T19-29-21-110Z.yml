          - article [ref=f69e262]:
            - heading "Business Login for Instagram" [level=1] [ref=f69e263]
            - generic [ref=f69e264]: "Updated: Mar 13, 2026"
            - generic [ref=f69e268]:
              - button "Copy for LLM" [ref=f69e270] [cursor=pointer]
              - link "View as Markdown" [ref=f69e277] [cursor=pointer]:
                - /url: /documentation/instagram-platform/instagram-api-with-instagram-login/business-login.md
            - generic [ref=f69e283]: Business Login is a custom login flow that allows your app to ask for permissions to access your app user’s Instagram professional account data and to get an access token to use in your app’s API requests.
            - generic [ref=f69e285]:
              - generic [ref=f69e286]:
                - text: To ensure consistency between scope values and permission names, we are introducing new
                - code [ref=f69e287]: scope
                - text: values for the Instagram API with Instagram login. The new
                - code [ref=f69e288]: scope
                - text: "values are:"
              - list [ref=f69e289]:
                - listitem [ref=f69e291]:
                  - code [ref=f69e292]: instagram_business_basic
                - listitem [ref=f69e294]:
                  - code [ref=f69e295]: instagram_business_content_publish
                - listitem [ref=f69e297]:
                  - code [ref=f69e298]: instagram_business_manage_messages
                - listitem [ref=f69e300]:
                  - code [ref=f69e301]: instagram_business_manage_comments
              - generic [ref=f69e302]:
                - text: These will replace the existing
                - code [ref=f69e303]: business_basic
                - text: ","
                - code [ref=f69e304]: business_content_publish
                - text: ","
                - code [ref=f69e305]: business_manage_comments
                - text: and
                - code [ref=f69e306]: business_manage_messages
                - code [ref=f69e307]: scope
                - text: values, respectively.
              - generic [ref=f69e308]:
                - text: Please note that the old scope values will be deprecated on
                - strong [ref=f69e309]: January 27, 2025
                - text: . It is essential to update your code before this date to avoid any disruption in your app’s functionality. Failure to do so will result in your app being unable to call the Instagram endpoints.
            - generic [ref=f69e312]:
              - heading "How it works" [level=3] [ref=f69e313]
              - button [ref=f69e314] [cursor=pointer]
            - generic [ref=f69e318]: Your app user launches the login flow on your app or website by clicking your embed URL link or button. This embed URL, that you set up in the App Dashboard with the permissions you are requesting from your app users, opens an authorization window. Your app user uses this window to grant your app permissions. When the user submits the login flow, Meta redirects your app user to your redirect URI and sends an authorization code. Your app can then exchange this authorization code for a short-lived Instagram User access token, an Instagram-scoped user ID for your app user, and a list of permissions the app user granted your app. Your app can exchanged this short-lived access token for a long-lived Instagram user access token that is valid for 60 days.
            - generic [ref=f69e321]:
              - heading "Before you start" [level=2] [ref=f69e322]
              - button [ref=f69e323] [cursor=pointer]
            - generic [ref=f69e327]:
